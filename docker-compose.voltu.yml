#
# Voltu overlay for the CitrineOS base stack. Apply it ON TOP of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.voltu.yml --profile ui pull
#   docker compose -f docker-compose.yml -f docker-compose.voltu.yml --profile ui up -d
#
# It (1) swaps the operator UI for the Voltu-branded image and (2) adds the two telemetry sidecars
# (bridge-emitter, ocpp-proxy). All image coordinates and secrets come from a `.env` file next to the
# compose files (see .env.deploy.example) so the same overlay works on any host / registry.
services:
  citrine-ui:
    image: ${VOLTU_REGISTRY:-ghcr.io/REPLACE_ME}/voltu-operator-ui:${VOLTU_IMAGE_TAG:-latest}
    pull_policy: always

  # The base compose pins ocpp-db to linux/amd64. On arm64 (Oracle Ampere) run it native — but the official
  # postgis/postgis image has no arm64 variant for this tag, so use imresamu/postgis (a multi-arch drop-in,
  # same Postgres 16 + PostGIS 3.5, same env/data dir). amd64 hosts set OCPP_DB_PLATFORM=linux/amd64 and can
  # switch OCPP_DB_IMAGE back to postgis/postgis:16-3.5.
  ocpp-db:
    image: ${OCPP_DB_IMAGE:-imresamu/postgis:16-3.5}
    platform: ${OCPP_DB_PLATFORM:-linux/arm64}

  # hasura reads its metadata over this bind mount as a non-root user. `:z` relabels the host dir for shared
  # SELinux container access (Oracle Linux enforces SELinux). Unlike Podman's `:U`, `:z` is a standard Docker
  # option, so the docker-compose provider passes it through. Harmless on non-SELinux hosts.
  graphql-engine:
    volumes:
      - ./apps/ocpp-server/hasura-metadata:/hasura-metadata:z
    environment:
      # No admin secret = anyone who reaches Hasura has full read/write over the DB. Required (long random;
      # must match apps/operator-ui/.env.local HASURA_ADMIN_SECRET). Network isolation is the firewall's job
      # (Oracle security list + firewalld allow only 22/443) — see the infra README hardening section.
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?set a long random HASURA_GRAPHQL_ADMIN_SECRET in .env}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_CORS_DOMAIN: ${PUBLIC_ORIGIN:-*}

  # Recent minio images ship without curl, so the base healthcheck can sit "unhealthy" forever and block the
  # startup chain. The core uses LOCAL file access (not minio), so don't gate startup on minio being healthy —
  # start minio-init once minio is up. minio-init already tolerates a not-yet-ready minio (its mc call is
  # guarded with `|| echo FAILED`), and citrine only needs minio-init to complete.
  minio-init:
    depends_on:
      minio:
        condition: service_started

  # Mode A durable replicator: tails the CitrineOS DB and POSTs signed envelopes to the Voltu bridge.
  voltu-bridge-emitter:
    image: ${VOLTU_REGISTRY:-ghcr.io/REPLACE_ME}/voltu-bridge-emitter:${VOLTU_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      VOLTU_DATABASE_URL: ${VOLTU_DATABASE_URL}
      VOLTU_BRIDGE_URL: ${VOLTU_BRIDGE_URL}
      CITRINE_BRIDGE_SECRET: ${CITRINE_BRIDGE_SECRET}
    depends_on:
      ocpp-db:
        condition: service_healthy

  # Mode B passive proxy: chargers point here; it relays to the incumbent CSMS and forks a copy to the bridge.
  # Only needed for parallel-mode owners; harmless to run otherwise (it just waits for connections).
  voltu-ocpp-proxy:
    image: ${VOLTU_REGISTRY:-ghcr.io/REPLACE_ME}/voltu-ocpp-proxy:${VOLTU_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      VOLTU_PROXY_UPSTREAM: ${VOLTU_PROXY_UPSTREAM}
      VOLTU_BRIDGE_URL: ${VOLTU_BRIDGE_URL}
      CITRINE_BRIDGE_SECRET: ${CITRINE_BRIDGE_SECRET}
      VOLTU_PROXY_PORT: "9310"
    ports:
      - "9310:9310"
