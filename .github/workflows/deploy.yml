#
# Deploy the Voltu CSMS stack to the target host (Oracle to begin with, but nothing here is
# Oracle-specific: it is "build images -> registry -> ssh + docker compose", so re-targeting to any
# VPS/cloud is only a change of secrets).
#
# Builds three images from this fork (the Voltu-branded operator UI + the two telemetry sidecars),
# pushes them to GHCR, then SSHes to the host and rolls the compose stack.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST        host/IP of the box
#   DEPLOY_USER        ssh user
#   DEPLOY_SSH_KEY     private key for that user (PEM)
#   DEPLOY_PORT        ssh port (optional, default 22)
#   DEPLOY_DIR         absolute path of the cloned repo on the box (optional, default ~/citrineos-core)
# Required repo variable (optional):
#   REGISTRY           image registry+owner, default ghcr.io/<repo owner>. Lets you adopt another registry.
#
# No PAT is needed: the built-in GITHUB_TOKEN both pushes (build job) and — because the box pulls DURING this
# run, not out of band — logs in and pulls on the host (deploy job has packages: read). It is short-lived, so
# nothing long-lived sits in secrets. (Only if you want the box to re-pull GHCR images on its own, outside a
# workflow run, would you add a read:packages PAT or make the packages public.)
#
# The host must already have: docker + compose v2, the repo cloned at DEPLOY_DIR, and a `.env` file next to
# the compose files (from .env.deploy.example). See infra/citrineos README section 10.

name: Deploy — Voltu CSMS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to the triggering commit)"
        required: false
  push:
    branches: [main]
    paths:
      - 'apps/operator-ui/**'
      - 'apps/voltu-bridge-emitter/**'
      - 'apps/voltu-ocpp-proxy/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - 'docker-compose.voltu.yml'
      - '.github/workflows/deploy.yml'

# Never roll two deploys at once.
concurrency:
  group: voltu-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        image:
          - name: voltu-operator-ui
            dockerfile: ./apps/operator-ui/Dockerfile
          - name: voltu-bridge-emitter
            dockerfile: ./apps/voltu-bridge-emitter/Dockerfile
          - name: voltu-ocpp-proxy
            dockerfile: ./apps/voltu-ocpp-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      # QEMU so the arm64 variant's runtime stage (e.g. operator-ui's adduser) can be assembled on an
      # amd64 runner. The heavy operator-ui build stays native (pinned to BUILDPLATFORM); sidecar deps
      # (pg / ws) are pure JS, so both arches share one build.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  deploy:
    name: Roll the stack on the host
    needs: build
    runs-on: ubuntu-latest
    environment: production # add required reviewers here for a manual approval gate
    permissions:
      contents: read
      packages: read # lets the passed-through GITHUB_TOKEN pull the images on the host
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_DIR,IMAGE_TAG,IMAGE_SHA,REPO
          script_stop: true
          script: |
            set -euo pipefail
            DIR="${DEPLOY_DIR:-$HOME/citrineos-core}"
            REPO_URL="https://x-access-token:${GHCR_TOKEN}@github.com/${REPO}.git"
            # Self-provision the repo tree: works whether DIR is missing, empty, or an existing checkout, so a
            # fresh box needs no manual `git clone`. The base compose references files/volumes from this tree.
            mkdir -p "$DIR"
            git config --global --add safe.directory "$DIR" || true
            cd "$DIR"
            [ -d .git ] || git init -q
            git remote remove origin 2>/dev/null || true
            git remote add origin "$REPO_URL"
            git fetch -q --depth=1 origin "${IMAGE_TAG}"
            git remote set-url origin "https://github.com/${REPO}.git"   # scrub the short-lived token from .git/config
            # Preserve host-managed config across the checkout: .env (compose) is untracked and safe, but
            # apps/operator-ui/.env.local is tracked upstream with dev defaults, so back it up and restore it.
            [ -f apps/operator-ui/.env.local ] && cp apps/operator-ui/.env.local /tmp/voltu-ui-env.bak || true
            git checkout -q -f FETCH_HEAD
            [ -f /tmp/voltu-ui-env.bak ] && mv /tmp/voltu-ui-env.bak apps/operator-ui/.env.local || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Deploy the exact image built for this commit (overrides VOLTU_IMAGE_TAG from .env),
            # so a deploy is deterministic and a rollback is just re-running with an older ref.
            export VOLTU_IMAGE_TAG="sha-${IMAGE_SHA}"
            # Rootless Podman only: RabbitMQ runs as uid 999 and doesn't chown its data dir, and the
            # docker-compose provider doesn't pass Podman's `:U`, so pre-own the bind mount for uid 999 in
            # the user namespace. No-op on Docker hosts (podman not installed). Persists on disk, but this
            # keeps a fresh/wiped box self-healing.
            if command -v podman >/dev/null 2>&1; then
              mkdir -p apps/ocpp-server/data/rabbitmq
              podman unshare chown -R 999:999 apps/ocpp-server/data/rabbitmq || true
              # hasura runs as a non-root user and reads its repo-tracked metadata dir over a bind mount;
              # make it world-readable so the container user can access it under the user namespace.
              chmod -R a+rX apps/ocpp-server/hasura-metadata || true
            fi
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.voltu.yml -f docker-compose.harden.yml --profile ui"
            # Zero-downtime steady state: `up -d` recreates ONLY the services whose image/config changed
            # (each deploy that's the sha-tagged citrine-ui + the two sidecars). Postgres, RabbitMQ, minio,
            # Hasura and the CitrineOS server keep running untouched, so the charger connections and the DB
            # never drop. (A one-off change to a service's PUBLISHED PORTS forces its recreate and can hit a
            # rootless-Podman port-release lag — handle that service once by hand; see the README.)
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built-in, short-lived; reused for the host pull
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          IMAGE_TAG: ${{ github.event.inputs.ref || github.sha }}
          IMAGE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
