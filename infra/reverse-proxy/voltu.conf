# /etc/nginx/conf.d/voltu.conf — Voltu reverse proxy (host nginx), designed to sit BEHIND Cloudflare.
#
# Traffic path:  charger/browser --TLS--> Cloudflare edge --TLS(origin cert)--> this nginx --loopback--> containers
#
# Cloudflare terminates the public TLS and re-encrypts to this origin with a Cloudflare Origin Certificate
# (SSL/TLS mode = Full (Strict)). The box firewall allows 443 ONLY from Cloudflare IP ranges, so the origin IP
# can't be reached directly (see the reverse-proxy README + infra hardening section). Real client IPs are
# restored from CF-Connecting-IP so logging and the dashboard allow-list see the true visitor, not Cloudflare.
#
# NOT using Cloudflare? Replace the Origin cert with Let's Encrypt (certbot), drop the set_real_ip_from block,
# and add a :80 server for the ACME challenge + redirect.

# --- Restore real client IP from Cloudflare (refresh from https://www.cloudflare.com/ips/) ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

# ============================================================================
#  Dashboard + its Hasura backend — app.voltu.energy  (public; protected by the operator login)
#  Reachable from anywhere. For a stronger identity gate in front of the whole app, put Cloudflare Access
#  (Zero Trust) on app.voltu.energy — recommended for an admin dashboard, but not IP-restricted here.
# ============================================================================
server {
	listen 443 ssl http2;
	server_name app.voltu.energy;

	ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
	ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

	add_header X-Frame-Options SAMEORIGIN always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	client_max_body_size 25m;

	# Hasura (the dashboard browser calls /v1/graphql, subscriptions over wss, console)
	location ~ ^/(v1|v1alpha1|v2|healthz|console)(/|$) {
		proxy_pass http://127.0.0.1:8090;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	# CitrineOS core REST API (the dashboard browser calls it for commands/data + file access). The trailing
	# slash on proxy_pass strips the /core prefix, so /core/ocpp/... -> 8080/ocpp/...
	location /core/ {
		proxy_pass http://127.0.0.1:8080/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		client_max_body_size 100m;   # firmware/cert uploads
	}

	# Operator UI (Next.js)
	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}
}

# ============================================================================
#  OCPP charger endpoint — ocpp.voltu.energy  (wss, open to chargers)
#  Not IP-restricted (chargers connect from anywhere); protected at the OCPP layer (auth per charger).
#  NOTE: OCPP security profile 3 (mutual TLS) cannot pass through Cloudflare's TLS termination — for those
#  chargers use a DNS-only (grey-cloud) record so they reach the origin directly, or terminate at the box.
# ============================================================================
server {
	listen 443 ssl http2;
	server_name ocpp.voltu.energy;
	ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
	ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

	location / {
		proxy_pass http://127.0.0.1:8081;   # CitrineOS OCPP websocket port — VERIFY against your config
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}

# ============================================================================
#  Voltu OCPP proxy (Mode B) — proxy.voltu.energy  (wss)
# ============================================================================
server {
	listen 443 ssl http2;
	server_name proxy.voltu.energy;
	ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
	ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

	location / {
		proxy_pass http://127.0.0.1:9310;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}

# --- Reject unknown Host / direct-IP probes that slip past the firewall ---
server {
	listen 443 ssl http2 default_server;
	server_name _;
	ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
	ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
	return 444;
}
